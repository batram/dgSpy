name: dgSpy CI
# test
on:
  push:
    branches: [dgspy]
  pull_request:
    branches: [dgspy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dgspy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    name: Unit tests and contracts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            7.0.x

      - name: Protocol tests
        shell: pwsh
        run: dotnet test tests/dgSpy.Protocol.Tests/dgSpy.Protocol.Tests.csproj --configuration Release --nologo --verbosity minimal

      - name: Gateway tests and contract snapshots
        shell: pwsh
        run: dotnet test tests/dgSpy.Gateway.Tests/dgSpy.Gateway.Tests.csproj --configuration Release --nologo --verbosity minimal

      - name: Extension tests
        shell: pwsh
        run: dotnet test tests/dgSpy.Extension.Tests/dgSpy.Extension.Tests.csproj --configuration Release --nologo --verbosity minimal

  cordebug-live:
    name: CorDebug live smoke (net10, shipping host)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            7.0.x

      - name: Build, test, and run live CorDebug smoke
        shell: pwsh
        env:
          # The smoke run defaults its logs to the process temp directory, which is not runner.temp,
          # so the collector below found nothing to upload.
          DGSPY_SMOKE_LOG_ROOT: ${{ runner.temp }}
        run: .\tests\run-modernization-gate.ps1 -Stage CorDebug

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cordebug-smoke-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/dgspy-smoke-*
          if-no-files-found: warn
          retention-days: 7

  cordebug-live-net48:
    name: CorDebug live smoke (net48, retained fallback)
    # Runs on every commit, same as the net10 job. A fallback is only a fallback if it works on the
    # commit you need it for, and this job is what makes "retained" mean something. It was briefly on a
    # weekly schedule instead; that reports against a commit nobody just pushed and hands you a batch of
    # suspects days later, which is worse signal for no saving in wall clock - this job is independent
    # of the net10 one, so the two run in parallel and only runner minutes differ.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            7.0.x

      - name: Build, test, and run live CorDebug smoke on net48
        shell: pwsh
        env:
          DGSPY_SMOKE_LOG_ROOT: ${{ runner.temp }}
        run: .\tests\run-modernization-gate.ps1 -Stage CorDebug -TargetFramework net48

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cordebug-net48-smoke-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/dgspy-smoke-*
          if-no-files-found: warn
          retention-days: 7
