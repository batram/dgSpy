name: dgSpy CI
on:
  push:
    branches: [dgspy]
  pull_request:
    branches: [dgspy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dgspy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-drift:
    name: Upstream drift
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      # Needs real history, not a shallow clone, so the dnSpyEx baseline commit
      # is reachable. Submodules are irrelevant to this check.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch dnSpyEx baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content tools/upstream-baseline.txt |
            Where-Object { $_ -notmatch '^\s*#' -and $_.Trim() } |
            Select-Object -First 1).Trim()
          git cat-file -e "$baseline^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags https://github.com/dnSpyEx/dnSpy.git master
          }

      # Fails on any difference from dnSpyEx that nobody wrote a reason for.
      # See the header of tools/check-upstream-drift.ps1 for why this exists.
      - name: Check drift against dnSpyEx
        shell: pwsh
        run: ./tools/check-upstream-drift.ps1 -Revision HEAD -Report

  unit-and-contract:
    name: Unit tests and contracts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            7.0.x

      - name: Protocol tests
        shell: pwsh
        run: dotnet test tests/dgSpy.Protocol.Tests/dgSpy.Protocol.Tests.csproj --configuration Release --nologo --verbosity minimal

      - name: Gateway tests and contract snapshots
        shell: pwsh
        run: dotnet test tests/dgSpy.Gateway.Tests/dgSpy.Gateway.Tests.csproj --configuration Release --nologo --verbosity minimal

      - name: Extension tests
        shell: pwsh
        run: dotnet test tests/dgSpy.Extension.Tests/dgSpy.Extension.Tests.csproj --configuration Release --nologo --verbosity minimal

      - name: Immutable build pipeline tests
        shell: pwsh
        run: dotnet test tests/DgSpyTool.Tests/DgSpyTool.Tests.csproj --configuration Release --nologo --verbosity minimal

  build-net10-package:
    name: Build verified net10 package once
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            7.0.x
      - name: Build, compose, and verify package
        shell: pwsh
        run: |
          dotnet run --project Build/DgSpyTool/DgSpyTool.csproj -c Release -- pipeline `
            --repo "${{ github.workspace }}" `
            --artifacts "${{ runner.temp }}/dgspy-artifacts" `
            --build-id "${{ github.sha }}" `
            --layout "${{ runner.temp }}/dgspy-layout" `
            --package "${{ runner.temp }}/dgspy-package"
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: dgspy-net10-package-${{ github.run_id }}
          path: ${{ runner.temp }}/dgspy-package
          if-no-files-found: error
          retention-days: 2

  cordebug-live:
    name: CorDebug live smoke (net10, shipping host)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: build-net10-package

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            7.0.x

      - name: Download verified net10 package
        uses: actions/download-artifact@v4
        with:
          name: dgspy-net10-package-${{ github.run_id }}
          path: ${{ runner.temp }}/dgspy-package

      - name: Build, test, and run live CorDebug smoke
        shell: pwsh
        env:
          # The smoke run defaults its logs to the process temp directory, which is not runner.temp,
          # so the collector below found nothing to upload.
          DGSPY_SMOKE_LOG_ROOT: ${{ runner.temp }}
        run: .\tests\run-modernization-gate.ps1 -Stage CorDebug -SkipHostBuild -LayoutRoot "${{ runner.temp }}/dgspy-package/cli"

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cordebug-smoke-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/dgspy-smoke-*
          if-no-files-found: warn
          retention-days: 7

  mono-target-live:
    name: Mono/Unity live smoke (${{ matrix.smoke }})
    # dgSpy is public and uch-debug-target is private, so this job needs an explicit credential
    # rather than the built-in GITHUB_TOKEN. Fork PRs never receive secrets, but a merged PR that
    # edited a build script would run with them on the following push, so keep the token off the
    # pull_request trigger entirely.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    needs: build-net10-package
    strategy:
      fail-fast: false
      matrix:
        # The Unity server=y agent accepts one debugger connection per player launch. These must be
        # separate jobs, not three sequential attach/detach passes against one process: a detached
        # agent can leave the TCP port listening while never accepting another DWP handshake.
        smoke: [debugger, search, scan-cursors]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            7.0.x

      - name: Download verified net10 package
        uses: actions/download-artifact@v4
        with:
          name: dgspy-net10-package-${{ github.run_id }}
          path: ${{ runner.temp }}/dgspy-package

      # Pinned to a tag on purpose. Tracking "latest" would make a regression gate's verdict depend
      # on when it happened to run. Hosted runners have no Unity editor and no licence, so the player
      # is built and published by hand; only consumption is automated.
      - name: Fetch the Unity debug target
        env:
          GH_TOKEN: ${{ secrets.UCH_TARGET_TOKEN }}
          UCH_TARGET_TAG: v1-unity2021.3.45f1
        shell: pwsh
        run: |
          gh release download $env:UCH_TARGET_TAG `
            --repo batram/uch-debug-target `
            --pattern 'uch-debug-target-release-*.zip' `
            --pattern 'manifest.json' `
            --dir "${{ runner.temp }}/uch-target"

      # The tag says what this should be; the hash says what it is. Without this a re-published or
      # truncated asset would surface as a debugger failure rather than a download problem.
      - name: Verify the download against its manifest
        shell: pwsh
        run: |
          $dir = "${{ runner.temp }}/uch-target"
          $manifest = Get-Content (Join-Path $dir 'manifest.json') -Raw | ConvertFrom-Json
          $zip = Get-ChildItem $dir -Filter 'uch-debug-target-release-*.zip' | Select-Object -First 1
          $asset = $manifest.assets | Where-Object { $_.name -eq $zip.Name }
          if (-not $asset) { throw "manifest.json does not describe $($zip.Name)" }
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          if ($actual -ne $asset.sha256) { throw "SHA-256 mismatch for $($zip.Name): expected $($asset.sha256), got $actual" }
          Write-Host "verified $($zip.Name) ($($asset.bytes) bytes) against manifest tag $($manifest.tag)"
          Expand-Archive $zip.FullName -DestinationPath (Join-Path $dir 'player')

      - name: Select the verified dgSpy layout
        shell: pwsh
        run: |
          dotnet run --project Build/DgSpyTool/DgSpyTool.csproj -c Release -- verify --layout "${{ runner.temp }}/dgspy-package/cli"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'DGSPY_LAYOUT_ROOT=${{ runner.temp }}/dgspy-package/cli'

      # Launching is the target repo's job (tools\Launch-Target.ps1), but its tooling is not in this
      # repo, so the two routes it uses are reproduced here. A Unity player does NOT read
      # --debugger-agent from its command line: passing it there is silently ignored, the port never
      # opens, and the player runs to completion as if no debugger had ever been asked for. The agent
      # options reach the runtime either through the environment variables dnSpy's Unity mono patch
      # reads, or through mono-debugger-agent in boot.config. Env first, boot.config as the fallback.
      - name: Launch the target
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}/uch-target/player"
          $player = Join-Path $root 'UchDebugTarget.exe'
          $bootConfig = Join-Path $root 'UchDebugTarget_Data/boot.config'
          $agent = '--debugger-agent=transport=dt_socket,server=y,address=127.0.0.1:56000,suspend=y'
          # Assigned, never splatted into an argument array: the parser cannot comma-split a variable
          # assignment, which is what makes this route immune to the malformed-option trap.
          $env:DNSPY_UNITY_DBG = $agent
          $env:DNSPY_UNITY_DBG2 = $agent
          $up = $null
          foreach ($route in 'env','bootconfig') {
            if ($route -eq 'bootconfig') {
              $lines = @()
              if (Test-Path $bootConfig) {
                $lines = @(Get-Content $bootConfig | Where-Object { $_ -notlike 'mono-debugger-agent*' -and $_ -notlike 'wait-for-managed-debugger*' })
              }
              Set-Content -Path $bootConfig -Value ($lines + "mono-debugger-agent=$agent") -Encoding ascii
            }
            # One log per route: -logFile truncates, so a shared name would leave only the last
            # attempt's log for a failure that needs both.
            $playerLog = Join-Path $root "ci-player-$route.log"
            Write-Host "launching via $route"
            $process = Start-Process -FilePath $player -ArgumentList '-batchmode','-nographics','-logFile',$playerLog -PassThru
            # Readiness is observed, never connected to. A connect-close without completing the DWP
            # handshake wedges the agent, and a bare connect while the runtime is still suspended
            # awaiting its first debugger kills the player outright. Both look like debugger bugs.
            $up = $null
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { break }
              $up = [Net.NetworkInformation.IPGlobalProperties]::GetIPGlobalProperties().GetActiveTcpListeners() |
                Where-Object { $_.Port -eq 56000 }
            } until ($up -or (Get-Date) -gt $deadline)
            if ($up) { Write-Host "agent listening on 127.0.0.1:56000 (route: $route)"; break }
            if ($process.HasExited) { Write-Host "player exited with code $($process.ExitCode) via $route" }
            else { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Write-Host "no agent on 56000 via $route"
          }
          if (-not $up) {
            foreach ($log in Get-ChildItem $root -Filter 'ci-player-*.log' -ErrorAction SilentlyContinue) {
              Write-Host "---- $($log.Name) ----"
              Get-Content $log.FullName -Tail 40
            }
            # A stock (unpatched) release runtime has no agent to enable by any route, so this is the
            # other thing to check when both routes come up empty.
            throw 'The Unity debugger agent never listened on 56000 via the environment or boot.config. Confirm MonoBleedingEdge\EmbedRuntime\mono-2.0-bdwgc.dll in the published player is the patched runtime.'
          }

      - name: Run the Mono/Unity live smoke
        shell: pwsh
        env:
          DGSPY_SMOKE_LOG_ROOT: ${{ runner.temp }}
        run: |
          switch ('${{ matrix.smoke }}') {
            'debugger' { .\tests\run-mono-target-smoke.ps1 }
            'search' { .\tests\run-search-smoke.ps1 }
            'scan-cursors' { .\tests\run-scan-cursor-smoke.ps1 }
            default { throw "Unknown Mono smoke '${{ matrix.smoke }}'" }
          }

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mono-target-${{ matrix.smoke }}-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dgspy-mono-smoke-*
            ${{ runner.temp }}/dgspy-search-smoke-*
            ${{ runner.temp }}/dgspy-scan-cursor-smoke-*
            ${{ runner.temp }}/uch-target/player/ci-player-*.log
          if-no-files-found: warn
          retention-days: 7
